# .github/workflows/ci.yml
# Phase 5 / Plan 05-01 (D-03 / HARD-01 + D-05 / HARD-02)
# First-ever CI pipeline: unit (lint + vitest) + e2e (playwright chromium) + lighthouse (LHCI).
#
# Tier-1 deterministic core runs UNCONDITIONALLY — specs mock Supabase via page.route(),
# so no live Supabase secrets are required for a green check. Tier-2 live/real-email specs
# stay skip-with-reason (E2E_AUTH_TEST_USERS OFF). See 05-RESEARCH.md §Q1.
#
# SECURITY (CLAUDE.md hard rule / Pitfall 2): only the anon-safe VITE_SUPABASE_URL +
# VITE_SUPABASE_ANON_KEY are VITE_-prefixed (inlined into the browser bundle). The
# service_role key is NEVER VITE_-prefixed and is NOT used in this Tier-1 pipeline.
name: CI

on:
  push:
    branches: [main, 'backup/**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint          # tsc --noEmit — baseline 296 zero-growth invariant (CI red on growth)
      - run: npm run test:run      # Vitest single run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run Playwright (deterministic core only by default)
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Anon-key + URL point at the dedicated TEST project (anon-safe → safe to expose to CI run).
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          # Tier-2 gate OFF by default → live-Supabase/real-email specs skip-with-reason.
          E2E_AUTH_TEST_USERS: ''
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g @lhci/cli@0.15.1
      - run: lhci autorun
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
