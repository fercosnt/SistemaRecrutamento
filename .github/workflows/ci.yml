# .github/workflows/ci.yml
# Phase 5 / Plan 05-01 (D-03 / HARD-01 + D-05 / HARD-02)
# First-ever CI pipeline: unit (lint + vitest) + e2e (playwright chromium) + lighthouse (LHCI).
#
# Tier-1 deterministic core runs UNCONDITIONALLY — specs mock Supabase via page.route(),
# so no live Supabase secrets are required for a green check. The app's client.ts THROWS
# at load if VITE_SUPABASE_URL/ANON_KEY are absent, so CI supplies anon-safe PLACEHOLDER
# values (the real network is mocked). If TEST_* repo secrets are configured they take
# precedence; otherwise the placeholders let the app boot so page.route mocks apply.
# Tier-2 live/real-email specs stay skip-with-reason (E2E_AUTH_TEST_USERS OFF). See 05-RESEARCH.md §Q1.
#
# tsc legacy debt: `tsc --noEmit` enforces a ZERO-GROWTH invariant (CI red only if the error
# count rises above the frozen baseline). The baseline is MEASURED, not guessed.
# Phase 16 (16-04) lowered it 292 -> 291; earlier ci.yml froze it at 290.
# Phase 22 (22-06, measure-first / CI-04+05+14): resolving the 65 phantom TS2307 via tsconfig
# `paths` (CI-05) cascaded the total 257 -> 133 (versioned imports were silently typing whole
# shadcn components as `any`), and expanding tsc coverage to e2e/scripts/playwright with the
# Deno files excluded (CI-14) added 0 net errors, pinning that phase's gate to a measured 133.
# Phase 25 (25-08, measure-first / FUNIL-04): the enum re-alias to the DB enum (25-02/03) +
# phantom-column removal in Editar-Vaga (25-03, -9) + mock-screen gutting (25-06, -8) cleared
# the count from 128 (the REAL value entering Phase 25 — the 133 pin had gone stale/loose so CI
# only tripped at 134) down to a MEASURED 107.
# Phase 27 (27-03, measure-first / CI-03): the 107 pin had gone stale — Phase 26 (26-03 n8n
# subtree deletion, -3) had already dropped the REAL count to 104 while CI still only tripped
# above 107. This plan's own edits (the submit-candidatura handler refactor — a test-only seam —
# plus the new Vitest client contract test) add 0 net tsc errors. Re-measured on the full
# autonomous tree with the exact CI command (npm run -s lint 2>&1 | grep -c "error TS") = a
# MEASURED 104. The gate is now pinned to the REAL measured green value 104 (superseding the
# stale 107 / 133 / loose 290) — red only on growth above 104.
# The FOUND-08 trivial enum typos (clinica/big_five in vagasTypes.ts) proved STRUCTURAL — each
# one-line rename only unmasks the next stale key in the same Record<> map (DEPARTAMENTO_LABELS /
# ETAPA_TO_KANBAN are wholesale-stale vs their unions) so they were reverted, not applied; the
# map-realignment is deferred with the tempo_integral/TIPO_VAGA_LABELS decision (16-01 backlog).
#
# SECURITY (CLAUDE.md hard rule / Pitfall 2): only the anon-safe VITE_SUPABASE_URL +
# VITE_SUPABASE_ANON_KEY are VITE_-prefixed (inlined into the browser bundle). The
# service_role key is NEVER VITE_-prefixed and is NOT used in this Tier-1 pipeline.
name: CI

on:
  push:
    branches: [main, 'backup/**']
  pull_request:

env:
  # Anon-safe placeholders so client.ts constructs and the app boots; Tier-1 specs mock all
  # network via page.route(). Real TEST_* repo secrets (anon key — public by design) win when set.
  VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || 'https://placeholder.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-ci-mocked-tests' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (frozen tsc baseline 104 — CI red only on growth)
        run: |
          COUNT=$(npm run -s lint 2>&1 | grep -c "error TS" || true)
          echo "tsc errors: $COUNT (frozen baseline: 104)"
          if [ "$COUNT" -gt 104 ]; then
            echo "::error::tsc error count ($COUNT) exceeds frozen baseline (104) — new type errors introduced"
            npm run -s lint 2>&1 | grep "error TS" | head -50
            exit 1
          fi
      - run: npm run test:run      # Vitest single run

      # Phase 44 / WR-08 — o gate `--check` da allowlist do export, BLOQUEANTE.
      #
      # Quatro docblocks tratavam este comando como autoridade
      # (`_shared/exportAllowlist.ts:6-9` diz, verbatim, "`--check` reprova qualquer
      # divergência"), e ele não era invocado em lugar nenhum: nem em `package.json`,
      # nem no hook de pre-commit, nem aqui. Rodava quando um humano lembrava.
      #
      # O QUE JÁ ESTAVA COBERTO e o que NÃO estava. A suíte cobre artefato↔artefato
      # (`exportAllowlist.test.ts (h)`) e artefato↔`VALUES` do smoke (`(k)`), mais os
      # inline snapshots que congelam o conteúdo. O que ficava de fora é a direção que
      # importa: editar `export-scope-rules.yaml`, `pii-inventory.yaml` ou
      # `catalogo-vivo-44.json` SEM regerar passava a suíte inteira no verde. E virar
      # um `decisoes_por_coluna.*.export` de `false` para `true` está documentado como
      # ação de UMA PALAVRA do operador — essas fontes existem para serem editadas.
      #
      # Não fala com o banco, não lê credencial, sai 0/1. Custo ~1 s.
      - run: npm run check:export-allowlist

      # Phase 47 / Plan 47-01 (TRANSP-02 · CONSOL-04) — os OUTROS TRÊS portões de
      # artefato, pela mesma razão do WR-08 acima, agora medida numa tabela.
      #
      # O FATO MEDIDO EM 2026-08-09. Antes deste plano, este workflow invocava UM
      # `check:` (o da allowlist, logo acima) e o `.husky/pre-commit` invocava
      # ZERO — ele roda só o gate de não-regressão do tsc. Ou seja:
      #
      #   · `check:recibo-exclusao` (45-02) estava em package.json e não era
      #     invocado em lugar nenhum, enquanto o docblock de `reciboExclusao.ts`
      #     dizia, verbatim, "`--check` reprova qualquer divergência";
      #   · `gen-pii-md.cjs` (42-04) já implementava `--check` e nunca teve script
      #     — o inventário de PII mais lido do repositório podia ficar stale em
      #     silêncio, e a Phase 47 edita a fonte dele;
      #   · `check:matriz-retencao` nasce aqui junto com o gerador, e não depois.
      #
      # Um script não invocado NÃO é portão: ele roda quando um humano lembra. O
      # requirement CONSOL-04 chama isso de promessa órfã, e um portão órfão é a
      # variante pior — ele PARECE um portão em toda leitura de docblock.
      # `docs/compliance/__tests__/portoesInvocados.test.ts` reprova o próximo.
      #
      # ⚠ EXCEÇÃO DECLARADA: `check:resend-dominio` fica DELIBERADAMENTE fora.
      # A Phase 36 (DELIV-01) o projetou como reporter opt-in e o proibiu em CI
      # pelo próprio docblock: é o único script do repositório que fala com a rede
      # e precisa de uma credencial viva do Resend. Ligá-lo aqui forçaria a chave
      # para dentro do GitHub Secrets — trocaria uma lacuna de documentação por
      # uma superfície de exposição de credencial (ameaça T-36-03-03). A exceção
      # está declarada com esta razão em `portoesInvocados.test.ts`, e é isso que
      # impede alguém de "consertá-la" no futuro.
      - run: npm run check:recibo-exclusao
      - run: npm run check:matriz-retencao
      - run: npm run check:pii-inventory-md

  # Phase 22 / Plan 22-06 (CI-01): the never-CI-run Deno Edge-Function test corpus now runs
  # as a BLOCKING job (type-check ON, no continue-on-error) so the EF layer that produced every
  # live defect stops apodrecendo. Command is the canonical one proven green in Plan 22-01
  # (148 passed / 0 failed): --config is REQUIRED (Deno discovers config from CWD, not the
  # target path) and its top-level `exclude` collect-skips the strict-schema Vitest probe —
  # the `--ignore=` fallback was NOT needed on Deno 2.7.7. --allow-env is required (tests call
  # Deno.env.get); --allow-read is harmless; no --allow-net (tests inject mocks).
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno EF corpus (blocking, type-check on)
        run: deno test --allow-env --allow-read --config supabase/functions/deno.json supabase/functions
      # Phase 27 / Plan 27-01 (CI-15): the never-CI-run sync-prompts service_role pipeline test
      # now runs as a distinct BLOCKING step with type-check ON (no type-check-skip flag) — matching the
      # corpus step's posture. NO --config here (functions/deno.json's exclude is functions-scoped
      # and the target root differs). The module builds its Supabase client only under
      # `if (import.meta.main)`, so importing it needs only --allow-read/--allow-env.
      - name: Deno scripts test (sync-prompts)
        run: deno test --allow-env --allow-read scripts/__tests__/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # CI-10 (PERF-03): assert-chunks self-gates via package.json `postbuild` after the build
      # above; this dedicated step re-runs it so a bundle regression emits a clean, distinct
      # failure signal (route/vendor split intact, eager index chunk under the Phase-19 floor).
      - name: Bundle gate (PERF-03)
        run: node scripts/assert-chunks.mjs
      # DELIV-02: proves no Resend key/endpoint reached the public bundle. Like the
      # bundle gate above, it already self-gates via package.json `postbuild` (it runs
      # FIRST there — security before performance); this dedicated step re-runs it so a
      # leak emits a clean, distinct failure signal instead of hiding inside the build log.
      # No live provider credential is needed: the guard is a pure fs read of build/.
      - name: Secret gate (DELIV-02)
        run: node scripts/assert-no-secrets.mjs
      - name: Run Playwright (deterministic core only by default)
        run: npx playwright test --project=chromium
        env:
          CI: true
          # Tier-2 gate OFF by default → live-Supabase/real-email specs skip-with-reason.
          E2E_AUTH_TEST_USERS: ''
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g @lhci/cli@0.15.1
      - run: lhci autorun
