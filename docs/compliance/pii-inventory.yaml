      prazo_nova_decisao_em:    { classificacao: preservar, tipo: timestamptz, nota: "Phase 48 (D-10) — fim do 10º dia corrido em SP; a data foi dita ao titular por e-mail" }
      alerta_prazo_enviado_em:  { classificacao: preservar, tipo: timestamptz, nota: "Phase 48 — controle de envio do alerta de prazo vencido ao RH. Sem PII; estado do processo" }

