# ---------------------------------------------------------------------------
# TABELAS SEM PII DE TITULAR — cobertas integralmente pelas regras R3/R4
# ---------------------------------------------------------------------------
tabelas_sem_pii_titular:
  regra_aplicada: R4
  nota: >-
    Conteúdo do produto, catálogo de itens de teste ou configuração de vaga.
    ⚠ UMA ENTRADA DESTA LISTA TEM RESSALVA ABERTA E MEDIDA (Phase 49, D-66):
    `analise_candidato_vaga` contém o primeiro nome do titular dentro de texto livre —
    9 de 25 linhas, RE-MEDIDO em 2026-09-23, e esse 9 é LIMITE INFERIOR. O número
    escrito aqui até 2026-09-24 era 13 de 24 e estava errado nos dois sentidos; a
    correção e a causa de cada erro estão em `WINDOWS.md` (83). O que torna o 9 um
    limite inferior é estrutural, não estatístico: casar contra o nome ATUAL é cego ao
    titular que JÁ exerceu a exclusão, porque o nome dele foi substituído em
    `candidatos` — e medido diretamente na linha dele, `resumo_cv` guarda o nome
    COMPLETO original (três partes, 132 caracteres) DEPOIS da exclusão concluída.
    `anonimizar_candidato` não cita esta tabela no corpo vivo (`position(...) = 0`).
    ⚠ A SEGUNDA ENTRADA QUE ESTE CAMPO ACUSAVA — `entrevista_guias` — NÃO tem PII do
    titular medida: zero de 5 guias contêm o primeiro nome dele. Os dois «achados» de
    2026-09-22 eram a palavra portuguesa comum `candidato` dentro do `rationale` do
    próprio guia, casando por acidente porque a conta de teste se chama «Candidato
    Funil Teste»; e não existe hoje nenhum guia pertencente a titular anonimizado
    (medido em 2026-09-24: 0 de 5), logo o ponto cego do probe também não a alcança.
    A capacidade estrutural permanece (o guia é derivado do currículo), e é por isso
    que a entrada fica nesta lista com ressalva em vez de sair dela em silêncio.
    A permanência das duas nesta lista é, portanto, DESCRITIVA do estado do motor, não
    uma afirmação de ausência de PII — e a saída delas pertence a QUEM CONSERTAR O
    MOTOR, não a quem reclassificar o registro: mover `analise_candidato_vaga` para
    `tabelas:` hoje obrigaria o recibo a dar um veredito por coluna, e o único
    disponível sem mentir seria uma linha nova dizendo ao titular que o seu nome
    continua nesses textos. O operador decidiu o contrário em 2026-09-23 (checkpoint
    do 49-17, opção (c)): o texto do recibo NÃO muda, o MOTOR passa a cumpri-lo.
    Dono: plano 49-29 (onda 8), que desidentifica os textos livres e trata as 8 linhas
    de titulares já anonimizados; a reclassificação desta lista vai com ele.
    Registrado em `WINDOWS.md` (83, `open`, dono 49-29) e no SUMMARY do plano 49-17.
  lista:
    - ai_cost_daily
    - analise_candidato_vaga        # ⚠ RESSALVA ABERTA (D-66, WINDOWS 83, dono: plano 49-29): 9 de 25
                                    # análises contêm o primeiro nome ATUAL do titular em
                                    # resumo_cv/resumo_respostas/gaps/pontos_fortes, e o motor não as
                                    # toca. O 9 é LIMITE INFERIOR: na linha do único titular já
                                    # anonimizado, resumo_cv guarda o nome COMPLETO original depois da
                                    # exclusão. Ver a `nota` desta seção.
                                    # Phase 49 (49-01, D-28): provedor_ia e modelo_ia nasceram aqui e
                                    # NÃO têm entrada explícita — a tabela é coberta em bloco pela R4
                                    # nesta lista, e uma coluna não pode ser classificada nos dois
                                    # lugares. As duas têm veredito de export escrito
                                    # (`export: false`, telemetria) no `export-scope-rules.yaml`, que é
                                    # o artefato onde essa decisão morde. Quando o 49-29 tirar a tabela
                                    # daqui, as duas ganham entrada em `tabelas:` junto das vizinhas.
                                    # Phase 48 (48-17): descartada_em (R1) e descartada_motivo (R3 em espírito —
                                    # vocabulário fechado `knockout_automatico`) = preservar. A marca do D-02
                                    # segue o destino da LINHA, como `status`: sem PII, e existe para provar a
                                    # correção de um tratamento sem finalidade (apagá-la desfaria a prova).
    - bias_audit_log                # ⚠ agregado — ERASE-01 depende dele
    - biblioteca_perguntas
    - bigfive_itens
    - cognitivo_itens
    - config_sla_etapa
    - entrevista_guias              # ⚠ RESSALVA ESTRUTURAL, não medida (D-66 CORRIGIDO, WINDOWS 83):
                                    # ZERO de 5 guias contêm o primeiro nome do titular. Os 2/5 que
                                    # este comentário afirmou até 2026-09-24 eram a palavra comum
                                    # `candidato` no `rationale` do próprio guia. Nenhum guia pertence
                                    # a titular anonimizado (0 de 5, medido em 2026-09-24), logo o ponto
                                    # cego do probe também não a alcança. A ressalva fica porque o jsonb
                                    # `guia` é DERIVADO do currículo e pode passar a conter o nome; o
                                    # motor não o toca. Ver a `nota` desta seção.
                                    # Phase 49 (49-01, D-28): provedor_ia e modelo_ia nasceram aqui e
                                    # NÃO têm entrada explícita nem veredito de export — a tabela é
                                    # coberta em bloco pela R4 aqui e está excluída no nível de TABELA
                                    # no `export-scope-rules.yaml` (`configuracao_do_produto`), onde um
                                    # veredito por coluna seria INERTE pelo fecho inverso do gerador.
