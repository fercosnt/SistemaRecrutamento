  requirement: INVENT-01
  fase: 42
  plano: 42-04
  coletado_em: "2026-07-29T14:08:18Z"
  fonte: |
    Catálogo VIVO de PROD (information_schema.columns + pg_constraint), projeto
    isljnozzlvckrgjjbjwp, via execute_sql do MCP do Supabase. NUNCA derivado de
    arquivos de migration — o DDL base de ~40 tabelas legadas vive fora do
