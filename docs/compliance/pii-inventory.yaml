# ---------------------------------------------------------------------------
# VOCABULÁRIO DE CLASSIFICAÇÃO
# ---------------------------------------------------------------------------
classificacoes:
  apagar: |
    Dado pessoal sem função probatória. Pode ser removido ou zerado na execução
    do direito do titular sem quebrar auditoria nem invariante do sistema.
  anonimizar: |
    Dado pessoal cuja LINHA precisa sobreviver (FK NO ACTION, série
    longitudinal, prova de não-discriminação), mas cujo CONTEÚDO identificante
    deve ser destruído in-place (tombstone). Art. 12 caput + Art. 16, IV.
  preservar: |
    Não é dado pessoal, OU é dado cuja preservação é exigida por obrigação
    legal/probatória (Art. 7º, II e Art. 16, I). Sobrevive intacto.
  preservar_com_ressalva: |
    Estruturalmente não-PII, mas pode CARREGAR PII digitada por humano ou
    embutida por IA em campo livre/JSONB. Exige tratamento caso a caso na
    Phase 45 — não pode ser classificado em massa.

# ---------------------------------------------------------------------------
# REGRA DE COBERTURA (torna a classificação de 993 colunas auditável)
# ---------------------------------------------------------------------------
# Toda coluna do schema `public` está classificada: pelas REGRAS abaixo, ou por
# entrada explícita em `tabelas:`. Entrada explícita SEMPRE vence a regra.
regras_padrao:
  - id: R1
    padrao: "id, *_id (chaves técnicas), created_at, updated_at, deleted_at, *_em"
    classificacao: preservar
    razao: "Identificador técnico ou carimbo temporal — não identifica pessoa por si só."
    excecao: "user_id / candidato_id / ator / por_usuario / usuario_id — ver R2."
  - id: R2
    padrao: "user_id, candidato_id, usuario_id, ator, por_usuario, revisada_por, avaliador_id, agendado_por, realizado_por, solicitado_por, revogado_por, created_by, updated_by"
    classificacao: anonimizar
    razao: |
      Ponteiro para pessoa. Apagar quebra FK NO ACTION da trilha de auditoria;
      preservar mantém vínculo identificante. ERASE-10: user_id apontando para
      linha VIVA do Auth é pseudonimização (Art. 12 §1º) e NÃO desincumbe o
      titular — a linha do Auth tem de morrer junto.
  - id: R3
    padrao: "flags booleanas, contadores, enums de status/etapa, scores numéricos, timestamps de fluxo"
    classificacao: preservar
    razao: "Estado de processo, não atributo de pessoa."
  - id: R4
    padrao: "campos de configuração de vaga, biblioteca de perguntas, templates, itens de teste"
    classificacao: preservar
    razao: "Conteúdo do produto, não do candidato."
  - id: R5
    padrao: "colunas jsonb de análise de IA (analise_ia*, raw_response, conteudo_jsonb, metadata, dados_antes, dados_depois)"
    classificacao: preservar_com_ressalva
    razao: |
      Estrutura não-PII, conteúdo potencialmente PII embutida por IA ou por
      captura de estado. Phase 45 precisa inspecionar, não classificar em massa.

