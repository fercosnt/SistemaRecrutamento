# Requirement: INVENT-01 · Decisão: D-P42-17/18 · Phase 42 / Plan 42-04
#
# Este arquivo é a FONTE. `pii-inventory.md` é gerado dele e existe só para
# leitura humana — em caso de divergência, este arquivo vence.
